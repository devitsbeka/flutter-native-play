# Cloudflare Workers (static assets) deployment for the MyTrivia web app.
#
# This is an assets-only Worker: there is no server code, so no `main` entry.
# Cloudflare serves ./dist straight from the edge, with unmetered bandwidth —
# which is why this host was chosen, given the build ships ~280 MB of video.
#
# Local commands:
#   npx wrangler dev        # serve ./dist locally through the Workers runtime
#   npx wrangler deploy     # manual deploy (CI does this on push to main)
#
# CI deploys via .github/workflows/deploy.yml using CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.

name = "mytrivia"
compatibility_date = "2026-08-04"

[assets]
directory = "./dist"

# Client-side routing: unmatched paths return index.html with a 200 rather
# than a 404, so deep links like /dev/v2, /profile and /challenge/:code load
# the app instead of an error page.
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Production domains. Cloudflare creates and manages the DNS records for these
# itself, so do not also point them at another origin by hand. To roll back,
# comment this block out and redeploy, then repoint DNS at the old host.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "mytrivia.io", custom_domain = true },
  { pattern = "www.mytrivia.io", custom_domain = true },
]

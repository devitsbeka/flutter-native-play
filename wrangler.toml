# Cloudflare Workers (static assets) deployment for the MyTrivia web app.
#
# Cloudflare serves ./dist straight from the edge, with unmetered bandwidth —
# which is why this host was chosen, given the build ships ~280 MB of video.
#
# It was assets-only until image questions needed a proxy. worker/index.ts
# handles exactly one route, /img, and hands everything else to the assets
# binding, which is what happened implicitly before it had any code.
#
# Local commands:
#   npx wrangler dev        # serve ./dist locally through the Workers runtime
#   npx wrangler deploy     # manual deploy (CI does this on push to main)
#
# CI deploys via .github/workflows/deploy.yml using CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.

name = "mytrivia"
main = "worker/index.ts"
compatibility_date = "2026-08-04"

# Keep the workers.dev URL alive as a fallback and staging target. Declaring
# `routes` turns this off by default, which takes the Worker offline entirely
# if the custom-domain attach fails.
workers_dev = true

# ---------------------------------------------------------------------------
# Production domains. Cloudflare creates and manages the DNS records for these
# itself, so do not also point them at another origin by hand. To roll back,
# comment this block out and redeploy, then repoint DNS at the old host.
#
# Must stay ABOVE [assets]: keys written after a TOML section header belong to
# that section, and `routes` nested under [assets] is silently ignored.
# ---------------------------------------------------------------------------
routes = [
  { pattern = "mytrivia.io", custom_domain = true },
  { pattern = "www.mytrivia.io", custom_domain = true },
]

[assets]
directory = "./dist"
# Named so worker/index.ts can hand unmatched requests straight back to the
# static build. Without a binding the Worker code would shadow the site.
binding = "ASSETS"

# Client-side routing: unmatched paths return index.html with a 200 rather
# than a 404, so deep links like /dev/v2, /profile and /challenge/:code load
# the app instead of an error page.
not_found_handling = "single-page-application"

# ---------------------------------------------------------------------------
# Read by worker/index.ts to build the link preview for a room invite. Both
# are public by design — the project ref and the *publishable* (anon) key, the
# same pair the client ships and .env tracks (CLAUDE.md rule 5). No secret
# belongs in this file: it is committed.
#
# Last in the file on purpose: keys after a section header join that section,
# so a [vars] block placed higher would be swallowed by whatever precedes it.
# ---------------------------------------------------------------------------

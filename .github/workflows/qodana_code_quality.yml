name: Qodana

# MANUAL ONLY, on purpose.
#
# This scan used to run on every push to main AND every pull request — two
# heavy runs per change, each doing a full-history checkout and a Docker-based
# analysis of a ~190k-line codebase. It was also the most expensive thing in
# the account by a wide margin.
#
# It produced nothing for that cost: the Qodana Cloud license token is
# declined, so every run fails before a single file is scanned, which is why
# the step below carries `continue-on-error: true`. Paying CI minutes for a
# scan that cannot run is what pushed this account into "spending limit needs
# to be increased", taking the production deploy down with it.
#
# TO RESTORE once QODANA_TOKEN is renewed: put back
#   pull_request:
# below, and verify one manual run goes green before re-adding the `push`
# trigger — a scan on both push and pull_request doubles the cost for a
# duplicate result.
on:
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2025.3
        # The Qodana Cloud license token is currently declined, which fails
        # every run before any code is scanned (including pushes to main).
        # Don't let a licensing outage block CI; scans resume normally once
        # the QODANA_TOKEN secret is renewed.
        continue-on-error: true
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1065697176 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
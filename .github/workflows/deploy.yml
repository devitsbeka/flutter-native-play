name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    # The repo is public, so standard-runner minutes are free and this is no
    # longer about cost. It stays because a deploy takes ~3.5 minutes and a
    # README edit cannot change what ships, so the wait buys nothing.
    #
    # Worth knowing when a deploy needs re-running: a path filter also means
    # an EMPTY commit will not trigger this workflow. A push with no changed
    # files matches the filter and is skipped, so `--allow-empty` is not a
    # way to retry — use "Re-run all jobs" in the Actions UI, or the
    # workflow_dispatch below.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

# One production deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The build ships ~280 MB of video. Cloudflare uploads only changed files
    # after the first deploy, but that first one is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x requires Node >= 22
          node-version: '22'
          cache: 'npm'

      - name: Check deploy credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        # .env is no longer committed, so these are passed explicitly — the
        # exact situation the previous comment here warned about.
        #
        # Vite inlines `undefined` for an unset VITE_* var, so a build with
        # these missing succeeds and ships a bundle that cannot reach the
        # backend at all. vite.config.ts now refuses to build in that state
        # rather than letting it deploy, but the values still have to arrive
        # from somewhere, and that is here.
        #
        # The fallbacks are the project ref and the *publishable* (anon) key,
        # which are designed to be public and were committed in this repo for
        # its whole history — they are not secrets. Setting the repository
        # secrets overrides them, which is the better long-term home.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sqwpzezkhpqkdyltvsim.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sqwpzezkhpqkdyltvsim' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxd3B6ZXpraHBxa2R5bHR2c2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzY5MTQsImV4cCI6MjA4MTkxMjkxNH0.tNtgf8sbZakCP6HAUtoxVSrcshZ1Lvn_1OqS7K7VhTc' }}

      # Smoke the built bundle before it reaches users. Unit tests cannot see
      # a route that renders a blank screen — a bad chunk-init order or a
      # context throwing on mount produces a white page and no failing unit
      # test anywhere. These run against the same dist/ that gets deployed.
      # Cached so a deploy does not re-download Chromium (~130 MB) every run.
      # The key follows the lockfile, so a Playwright version bump refreshes it.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match the wrangler version pinned in package.json — the action
          # otherwise installs wrangler 3.x, which predates assets-only
          # Workers support used by wrangler.toml.
          wranglerVersion: "4.118.0"

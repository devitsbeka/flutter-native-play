name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The build ships ~280 MB of video. Cloudflare uploads only changed files
    # after the first deploy, but that first one is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4.x requires Node >= 22
          node-version: '22'
          cache: 'npm'

      - name: Check deploy credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set as repository secrets."
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        # Supabase URL and the (public) anon key come from the committed .env.
        # If .env is ever removed from the repo, add them as secrets and pass
        # them here as VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY.

      # Smoke the built bundle before it reaches users. Unit tests cannot see
      # a route that renders a blank screen — a bad chunk-init order or a
      # context throwing on mount produces a white page and no failing unit
      # test anywhere. These run against the same dist/ that gets deployed.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Upload smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Match the wrangler version pinned in package.json — the action
          # otherwise installs wrangler 3.x, which predates assets-only
          # Workers support used by wrangler.toml.
          wranglerVersion: "4.118.0"

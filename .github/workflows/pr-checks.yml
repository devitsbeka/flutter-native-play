name: PR checks

# Pull requests had no CI at all. deploy.yml runs only on push to main, and
# Qodana is manual-only — so the first thing that ran against a branch was the
# production deploy, after merge.
#
# That is how untracking .env nearly shipped: the deploy took the Supabase URL
# from that committed file, Vite inlines `undefined` for an unset VITE_* var,
# and the build succeeds and deploys an app that cannot reach its backend.
# `npm run build` here catches exactly that, because vite.config.ts now
# refuses to build without those values.
#
# COST. This repo is metered, and the Qodana note is explicit that running the
# same analysis on both push and pull_request doubles the spend for a
# duplicate result. So this deliberately does NOT run the Playwright smokes —
# deploy.yml already pays for those on main, and they are the expensive part
# (a Chromium download plus ~6 minutes). What is here is the cheap half that
# fails fast on a broken branch.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

# A new push supersedes an in-flight run on the same PR.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Was a no-op until recently: the root tsconfig carries `files: []` with
      # project references, so `tsc --noEmit` resolved to an empty program and
      # passed unconditionally. It points at the real projects now.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        # Same values as the deploy. The fallbacks are the public project ref
        # and anon key; repository secrets override them.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sqwpzezkhpqkdyltvsim.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sqwpzezkhpqkdyltvsim' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxd3B6ZXpraHBxa2R5bHR2c2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzY5MTQsImV4cCI6MjA4MTkxMjkxNH0.tNtgf8sbZakCP6HAUtoxVSrcshZ1Lvn_1OqS7K7VhTc' }}
        run: npm run build

  # The money paths, executed rather than reviewed. Entitlements and currency
  # are enforced in plpgsql, where a CREATE FUNCTION succeeding proves nothing
  # about the body — table references resolve at call time. Cheap: a Postgres
  # service container and a few seconds of SQL.
  entitlements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # The runner image ships psql already; apt is only for when it does
      # not. And a broken index in a repository the job never uses (Google
      # Chrome's, once, a hash mismatch mid-update) must not take the whole
      # job down before a single migration has run.
      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update || true
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          PSQL="psql -h localhost -p 5432 -U postgres -q"
          $PSQL -f supabase/tests/00-supabase-shim.sql
          # Roughly 36 historical migrations depend on Supabase's own
          # storage/realtime schemas and cannot apply here. That is expected;
          # every table the entitlement functions touch does get created, and
          # the assertions below fail loudly if one is missing.
          for f in supabase/migrations/*.sql; do
            $PSQL -f "$f" >/dev/null 2>&1 || true
          done

      - name: Assert entitlement and currency rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/02-assertions.sql

      # Written at the same time as the seat feature and never wired up, so
      # the rules about who may give PRO away — and to whom — were the one
      # part of the entitlement SQL nothing executed. The refusal that turned
      # out to be wrong ("that player already has their own subscription",
      # raised at every player who had ever bought VIP days with coins) would
      # have been caught here.
      - name: Assert PRO seat rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/03-pro-seats.sql

      # The shop's purchase path. Three free-grant holes closed at once —
      # grant_vip_days took a duration and nothing else, credit_gameplay_reward
      # accepted the 'shop_grant' kind with a 2000-gems-a-day ceiling, and
      # adjust_power_up took any positive delta — plus the coins/gems arbitrage
      # that turned 24 gems into 30 through the exchange. All of it is "the
      # grant works without the debit", which no amount of client code can
      # assert; this executes both halves against a real Postgres.
      #
      # It also caught a 42702 in the new SQL itself: a RETURNS TABLE column
      # named after a table column made an ON CONFLICT clause ambiguous, which
      # CREATE FUNCTION accepts happily and only fails when called.
      - name: Assert shop purchase and exchange rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -f supabase/tests/19-shop-purchase.sql

      # Multi-round rooms: cumulative scoreboard totals must accumulate for
      # every participant (not just the host), exactly once per round —
      # complete_room_round's contract. The client-side version of this write
      # was silently RLS-blocked for all non-host rows, which is the
      # "0 points and 0 rounds after every round" bug.
      - name: Assert room round totals rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/04-room-rounds.sql

      # Invite links. The code in a shared link is what proves the host asked
      # for the introduction: friendships lets a signed-in user insert any row
      # naming themselves, status included, so a client-side "we are friends
      # now" would be "I am in your friends list now" for anyone whose user id
      # you can learn — and every room participant can read those. These
      # assert the code cannot be chosen by a client, that an unminted code
      # buys nothing, and that accepting twice makes one friendship and not
      # two.
      - name: Assert invite link rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/05-invite-links.sql

      # How many levels a category advertises. The count divides by the
      # THINNEST language, which is right for a shared category and wrong for
      # one that belongs to a single language: six stray questions filed
      # against საქართველოს ისტორია in six other languages, two apiece, held
      # a category with 194 Georgian questions at ONE level. These assert the
      # Georgian-only case reads its own language, and — just as important —
      # that a genuinely shared category is still capped by its worst.
      - name: Assert category level counting
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/06-category-levels.sql

      # The level-17 backfill. Eight categories advertised fewer than 17
      # levels, and in six of them that was a translation gap rather than a
      # content shortage: translate-questions only ever fans the ENGLISH bank
      # out, so 936 questions authored in Georgian were invisible to it and
      # raised nobody's level count, Georgian's included. The migration
      # translates that tail. This seeds a database with the same shape, runs
      # the migration TWICE, and asserts every language lands at exactly 170 —
      # a second run that duplicated its rows would read 340.
      - name: Assert level-17 backfill
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/07-level17-backfill.sql

      # "Most Likely To" vote settlement. The party category has no fixed
      # correct answer — players vote for a player and the majority wins —
      # so points are minted by a SECURITY DEFINER tally, not by the client.
      # These assert the tally's contract: exactly-once per question, ties
      # all win, timeouts never count, and a normal trivia question can
      # never be "settled" into free points.
      - name: Assert most-likely-to vote settlement
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/09-most-likely-votes.sql

      # Nothing that moves money is reachable by an unauthenticated caller.
      # claim_daily_reward was: Supabase's bootstrap grants anon EXECUTE on
      # every new function in `public`, and `REVOKE ... FROM public` revokes
      # the PUBLIC pseudo-role, not that explicit grant — so the migration
      # reads as if it closed the door and does not. Nine migrations here
      # write `FROM PUBLIC, anon` and twenty write `FROM public` alone, which
      # is why this is a test rather than a fix and a hope.
      - name: Assert money functions are not reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/08-money-not-anon.sql

      # The game type registry drives the /play chooser and dark-launches
      # modes off is_live. A write policy added "for convenience" would let a
      # signed-in user flip a mode live (or retitle one) for every player at
      # once, so: readable by all, writable by no client role.
      - name: Assert game type registry is client-immutable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/09-game-types.sql

      # Team Battle is decided entirely in SECURITY DEFINER plpgsql —
      # rotation, prices, scoring, the tie-breaker, the payouts. This plays
      # two full matches through the public RPCs (one decided on the board,
      # one tied into the super round) and asserts every refusal that keeps
      # the match honest: wrong player at every phase, client-named prices
      # ignored, out-of-order and double answers, double settlement.
      - name: Assert team battle rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/10-team-battle.sql

      # MyTrivia King's promise is enforced by what the client cannot see and
      # when: no options during the think phase (not in any RPC result, not
      # in any readable table), server-stamped think/commit deadlines, the
      # reveal only after the commit, once-only ledgered payouts. This plays
      # a full match to 6 through the public RPCs and asserts each claim.
      - name: Assert king rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/11-king.sql

      # Global matchmaking: the matcher runs inside enqueue under a
      # per-bucket advisory lock and creates the room in the same
      # transaction that stamps the queue rows. Asserted behaviourally:
      # language buckets never leak, FIFO cuts the match when the bucket
      # fills, rooms come out shaped for their game type, the dark launch
      # refuses hand-crafted enqueues, expiry/cancel/re-enqueue leave one
      # waiting entry per player.
      - name: Assert matchmaking rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/12-matchmaking.sql

      # Publishing a room shows it to everyone without opening it to
      # everyone, and that is only true while a stranger cannot write
      # themselves a seat. room_participants carried two OR-ed insert
      # policies, so narrowing one of them would have changed nothing —
      # which is the kind of gate that passes review and holds nothing.
      - name: Assert public room and join-approval rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/13-public-rooms.sql

      # Streak milestones. The streak page pays 3, 5, 7, 14, 21 and 30 days
      # in coins, once each, through claim_streak_milestone. The client
      # cannot read the grant ledger, so "once" is decided here or nowhere:
      # these assert a milestone below the streak is refused, one already
      # paid is refused without moving the wallet, and one player's ledger
      # is not another's.
      - name: Assert streak milestone rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/14-streak-milestones.sql

      # The room pot. A room round is played for a stake, settled once,
      # server-side: every seat pays in, the table is paid out, nothing is
      # minted — and every device that asks is told what moved, not only
      # the first. The file existed; CI had never run it.
      - name: Assert room pot rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/15-room-pot.sql

      # The subscription welcome. It is granted by a trigger on
      # vip_subscriptions, which the webhook writes on every renewal — so
      # what is proved here is mostly what does NOT grant: a renewal, an
      # expired row, ad_free, and a second call from the edge function,
      # which shares the same iap_events claim.
      - name: Assert subscription welcome rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/16-pro-welcome.sql

      # What a public card advertises. The rounds come from the RPC because
      # a stranger may not read room_category_queue at all, so the thing
      # being proved is that the SECURITY DEFINER path answers them — in
      # order, with both fallbacks.
      - name: Assert public room rounds
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/17-public-room-rounds.sql

      # A public room ends with its play. One rule for when it is over —
      # quiet an hour, and mid-round, finished, or played out with nothing
      # to play — the Public tab refuses to list such a room, and the sweep
      # the app runs before reading that tab closes it, cancelled and
      # archived. Private rooms are never touched.
      - name: Assert public rooms end
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/17-public-rooms-end.sql

      # A public room is public once: the first claimed round turns it
      # private, on whichever device claims it, and nothing turns it back.
      - name: Assert a public room is public once
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/18-public-once.sql

      # A room never wears a category's icon: the trigger that undresses one
      # on insert and on update, executed against the real table.
      - name: Assert a room never wears a category's icon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/20-room-icons.sql

      # The Guess card's stake: 200 in, +200 on a pass, -200 on a fail, once
      # per run, floored at the balance, out of anon's reach.
      - name: Assert the guess game settles at its own stake
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/21-guess-stake.sql


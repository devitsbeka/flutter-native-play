name: PR checks

# Pull requests had no CI at all. deploy.yml runs only on push to main, and
# Qodana is manual-only — so the first thing that ran against a branch was the
# production deploy, after merge.
#
# That is how untracking .env nearly shipped: the deploy took the Supabase URL
# from that committed file, Vite inlines `undefined` for an unset VITE_* var,
# and the build succeeds and deploys an app that cannot reach its backend.
# `npm run build` here catches exactly that, because vite.config.ts now
# refuses to build without those values.
#
# COST. This repo is metered, and the Qodana note is explicit that running the
# same analysis on both push and pull_request doubles the spend for a
# duplicate result. So this deliberately does NOT run the Playwright smokes —
# deploy.yml already pays for those on main, and they are the expensive part
# (a Chromium download plus ~6 minutes). What is here is the cheap half that
# fails fast on a broken branch.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'

# A new push supersedes an in-flight run on the same PR.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Was a no-op until recently: the root tsconfig carries `files: []` with
      # project references, so `tsc --noEmit` resolved to an empty program and
      # passed unconditionally. It points at the real projects now.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        # Same values as the deploy. The fallbacks are the public project ref
        # and anon key; repository secrets override them.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://sqwpzezkhpqkdyltvsim.supabase.co' }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'sqwpzezkhpqkdyltvsim' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxd3B6ZXpraHBxa2R5bHR2c2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzY5MTQsImV4cCI6MjA4MTkxMjkxNH0.tNtgf8sbZakCP6HAUtoxVSrcshZ1Lvn_1OqS7K7VhTc' }}
        run: npm run build

  # The money paths, executed rather than reviewed. Entitlements and currency
  # are enforced in plpgsql, where a CREATE FUNCTION succeeding proves nothing
  # about the body — table references resolve at call time. Cheap: a Postgres
  # service container and a few seconds of SQL.
  entitlements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          PSQL="psql -h localhost -p 5432 -U postgres -q"
          $PSQL -f supabase/tests/00-supabase-shim.sql
          # Roughly 36 historical migrations depend on Supabase's own
          # storage/realtime schemas and cannot apply here. That is expected;
          # every table the entitlement functions touch does get created, and
          # the assertions below fail loudly if one is missing.
          for f in supabase/migrations/*.sql; do
            $PSQL -f "$f" >/dev/null 2>&1 || true
          done

      - name: Assert entitlement and currency rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/02-assertions.sql

      # Written at the same time as the seat feature and never wired up, so
      # the rules about who may give PRO away — and to whom — were the one
      # part of the entitlement SQL nothing executed. The refusal that turned
      # out to be wrong ("that player already has their own subscription",
      # raised at every player who had ever bought VIP days with coins) would
      # have been caught here.
      - name: Assert PRO seat rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/03-pro-seats.sql

      # Multi-round rooms: cumulative scoreboard totals must accumulate for
      # every participant (not just the host), exactly once per round —
      # complete_room_round's contract. The client-side version of this write
      # was silently RLS-blocked for all non-host rows, which is the
      # "0 points and 0 rounds after every round" bug.
      - name: Assert room round totals rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/04-room-rounds.sql

      # Invite links. The code in a shared link is what proves the host asked
      # for the introduction: friendships lets a signed-in user insert any row
      # naming themselves, status included, so a client-side "we are friends
      # now" would be "I am in your friends list now" for anyone whose user id
      # you can learn — and every room participant can read those. These
      # assert the code cannot be chosen by a client, that an unminted code
      # buys nothing, and that accepting twice makes one friendship and not
      # two.
      - name: Assert invite link rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/05-invite-links.sql

      # How many levels a category advertises. The count divides by the
      # THINNEST language, which is right for a shared category and wrong for
      # one that belongs to a single language: six stray questions filed
      # against საქართველოს ისტორია in six other languages, two apiece, held
      # a category with 194 Georgian questions at ONE level. These assert the
      # Georgian-only case reads its own language, and — just as important —
      # that a genuinely shared category is still capped by its worst.
      - name: Assert category level counting
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/06-category-levels.sql

      # The level-17 backfill. Eight categories advertised fewer than 17
      # levels, and in six of them that was a translation gap rather than a
      # content shortage: translate-questions only ever fans the ENGLISH bank
      # out, so 936 questions authored in Georgian were invisible to it and
      # raised nobody's level count, Georgian's included. The migration
      # translates that tail. This seeds a database with the same shape, runs
      # the migration TWICE, and asserts every language lands at exactly 170 —
      # a second run that duplicated its rows would read 340.
      - name: Assert level-17 backfill
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/07-level17-backfill.sql

      # Nothing that moves money is reachable by an unauthenticated caller.
      # claim_daily_reward was: Supabase's bootstrap grants anon EXECUTE on
      # every new function in `public`, and `REVOKE ... FROM public` revokes
      # the PUBLIC pseudo-role, not that explicit grant — so the migration
      # reads as if it closed the door and does not. Nine migrations here
      # write `FROM PUBLIC, anon` and twenty write `FROM public` alone, which
      # is why this is a test rather than a fix and a hope.
      - name: Assert money functions are not reachable by anon
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/08-money-not-anon.sql

      # The game type registry drives the /play chooser and dark-launches
      # modes off is_live. A write policy added "for convenience" would let a
      # signed-in user flip a mode live (or retitle one) for every player at
      # once, so: readable by all, writable by no client role.
      - name: Assert game type registry is client-immutable
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/09-game-types.sql

      # Team Battle is decided entirely in SECURITY DEFINER plpgsql —
      # rotation, prices, scoring, the tie-breaker, the payouts. This plays
      # two full matches through the public RPCs (one decided on the board,
      # one tied into the super round) and asserts every refusal that keeps
      # the match honest: wrong player at every phase, client-named prices
      # ignored, out-of-order and double answers, double settlement.
      - name: Assert team battle rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/10-team-battle.sql

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         numbers. Without it every inset reads 0, so --safe-top is 0, and any
         padding derived from it silently does nothing — which is what was
         happening while the status bar strip sat outside the webview
         entirely. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Tints the browser's status/toolbar area. It must match the app's own
         page wash (the lavender GlobalSplineBackground, measured #f8e6ff at
         the top of the page) — the brand violet that used to sit here painted
         a solid purple slab above a near-white page on iOS. -->
    <meta name="theme-color" content="#fbfaf8" />
    <title>MyTrivia</title>
    <meta name="description" content="შეამოწმე შენი ცოდნა და გახდი Trivia-ს ჩემპიონი" />
    <meta name="author" content="MyTrivia" />

    <meta property="og:title" content="MyTrivia" />
    <meta property="og:description" content="შეამოწმე შენი ცოდნა და გახდი Trivia-ს ჩემპიონი" />
    <meta property="og:type" content="website" />
    <!-- Rewritten per invite by worker/index.ts; the site URL otherwise. -->
    <meta property="og:url" content="https://mytrivia.io/" />
    <meta property="og:image" content="https://mytrivia.io/og-image.png?v=2" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@MyTrivia" />
    <meta name="twitter:image" content="https://mytrivia.io/og-image.png?v=2" />

    <!-- App Icon -->
    <!-- The crown, matching the wordmark in og-image.png. app-icon.png is the
         old "LIVE" mascot badge and app-icon-1024/apple-touch-icon.png are an
         older orange question mark again — three different marks were being
         served as this app's icon, and the one next to a shared link was the
         oldest of them. -->
    <link rel="icon" href="/app-icon-crown.png?v=3" type="image/png" />
    <link rel="apple-touch-icon" href="/app-icon-crown.png?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyTrivia" />
    
    <!-- PWA Manifest & Orientation Lock -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="screen-orientation" content="portrait" />

    <!-- Google Sans Font with Georgian support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;600;700&family=Slackey&display=swap" rel="stylesheet">

    <!-- Meta Pixel Code -->
    <!-- native:strip:start -->
    <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '845894748475852');
    fbq('track', 'PageView');
    </script>
    <!-- native:strip:end -->
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <!-- native:strip:start -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=845894748475852&ev=PageView&noscript=1"
    /></noscript>
    <!-- native:strip:end -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

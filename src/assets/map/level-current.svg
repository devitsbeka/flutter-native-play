<svg width="128" height="115" viewBox="0 0 128 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring shadow -->
  <ellipse cx="64" cy="60" rx="58" ry="52" fill="#2563eb"/>
  <!-- Main button body -->
  <ellipse cx="64" cy="55" rx="54" ry="48" fill="url(#blueGradient)"/>
  <!-- Inner highlight -->
  <ellipse cx="64" cy="48" rx="46" ry="40" fill="url(#lightGradient)"/>
  <!-- Shine effect -->
  <ellipse cx="48" cy="35" rx="18" ry="12" fill="white" opacity="0.4"/>
  
  <defs>
    <linearGradient id="blueGradient" x1="64" y1="10" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="lightGradient" x1="64" y1="10" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
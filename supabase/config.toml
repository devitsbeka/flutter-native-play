# --- WEBHOOKS (must be public - called by external services) ---
[functions.stripe-gem-webhook]
verify_jwt = false

# Authenticated by REVENUECAT_WEBHOOK_SECRET in the Authorization header
# instead — RevenueCat has no Supabase session. The function refuses to run
# when that secret is unset.
[functions.revenuecat-webhook]
verify_jwt = false

# The real scheduled pushes, fired by pg_cron every 30 minutes — no session
# to verify. Authenticated by the shared cron secret in x-cron-secret
# (PUSH_CRON_SECRET, falling back to the PUSH_TEST_SECRET already set for
# the retired test loop).
[functions.scheduled-pushes]
verify_jwt = false

# Friend request/accept and challenge-beaten pushes. verify_jwt is off
# because challenge links are played signed out and the challenger must
# still hear about a beaten score; the friend paths require and validate a
# JWT inside the function, and every event can fire at most once via
# push_log's unique (kind, detail) index.
[functions.send-social-push]
verify_jwt = false

# Registration happens signed out, exactly like the auth signup endpoint
# this replaces for username accounts. It creates pre-confirmed
# @mytrivia.local accounts only — an @ in the input is refused, so it
# cannot pre-confirm a real address.
[functions.register-username]
verify_jwt = false


# =============================================================================
# EDGE FUNCTION JWT CONFIGURATION
# =============================================================================
# verify_jwt = true: Requires valid Supabase auth token (user must be logged in)
# verify_jwt = false: Public endpoint (webhooks, public APIs)
#
# SECURITY RULE: All functions that incur AI/API costs, modify user data,
# send notifications, or handle payments MUST have verify_jwt = true
# =============================================================================

